[project]
name = "triager"
version = "0.1.0"
description = "Conservative triage of Dependabot alerts for Python: vulnerable-function identification and reachability, kept separate."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "unidiff>=1.0.1",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
# Use uv-managed CPython only, never a system/Anaconda interpreter.
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Kept byte-for-byte unchanged for provenance (produced the Phase 1.1 FACT numbers).
extend-exclude = ["scripts/survey_ghsa.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
